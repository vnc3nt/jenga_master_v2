<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenga Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="connectionBanner"></div>
    <div id="app">
        <div id="mainPage" class="container">
            <div id="espStatusGrid" class="esp-status-grid"></div>
            <div class="header-tools">
                <button id="themeToggle" class="icon-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>

            <div class="mode-switch-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="viewToggle">
                    <span class="slider round">
                        <div class="slider-labels">
                            <span class="label-text label-left">Spiel</span>
                            <span class="label-text label-right">Rangliste</span>
                        </div>
                    </span>
                </label>
            </div>

            <div class="global-controls-section">
                <div class="global-controls-row">
                    
                    <button id="globalResetBtn" class="btn btn-reset btn-global-icon" title="Neustart / Speichern">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                    </button>

                    <div id="globalTimeDisplay" class="time-display" onclick="tryOpenGlobalTimeModal()">00:00</div>
                    
                    <button id="globalPlayBtn" class="btn btn-primary btn-global-icon" title="Start / Pause">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>

                </div>
            </div>

            <div id="robotGrid" class="robot-grid">
                <div style="text-align: center; color: #aaa; padding: 2rem;">Warte auf Verbindung...</div>
            </div>

            <div id="leaderboardView" class="hidden">
                
                <div class="filter-card">
                    
                    <div class="filter-row">
                        <div class="switch-toggle-3">
                            <input type="radio" id="modeAll" name="lbMode" value="all" checked>
                            <label for="modeAll">Alle</label>
                            
                            <input type="radio" id="modeBest" name="lbMode" value="best">
                            <label for="modeBest">Beste</label>
                            
                            <input type="radio" id="modeAvg" name="lbMode" value="avg">
                            <label for="modeAvg">Ø</label>
                            
                            <div class="toggle-glider"></div>
                        </div>
                    </div>

                    <div class="filter-row" style="margin-top: 1.5rem; flex-direction: column; align-items: stretch;">
                        <div class="slider-labels-top">
                            <span>Filter: Rundenzeit</span>
                            <span id="timeRangeVal" style="color:var(--primary); font-weight:bold;">0 - 10 min</span>
                        </div>
                        <div class="dual-range-container">
                            <div class="range-track"></div>
                            <input type="range" id="rangeMin" min="0" max="600" value="0">
                            <input type="range" id="rangeMax" min="0" max="600" value="600">
                        </div>
                    </div>

                </div>

                <div id="leaderboardList"></div>
                
                <div style="margin-top: 2rem;">
                    <button id="deleteAllBtn" class="btn btn-secondary" style="width: 100%; color: var(--danger);">Alle Daten löschen</button>
                </div>
            </div>

        </div>

        <div id="timeModal" class="modal">
            <div class="modal-content">
                <h2 class="modal-title">Startzeit ändern</h2>
                <div class="time-input-wrapper">
                    <input type="number" id="inputMin" class="time-input" placeholder="05" min="0" max="99">
                    <span class="time-separator">:</span>
                    <input type="number" id="inputSec" class="time-input" placeholder="00" min="0" max="59">
                </div>
                <div class="modal-actions">
                    <button id="modalCancelBtn" class="btn btn-secondary" style="padding: 1rem;">Abbrechen</button>
                    <button id="modalSaveBtn" class="btn btn-primary" style="padding: 1rem;">Speichern</button>
                </div>
            </div>
        </div>

        <div id="resetModal" class="modal">
            <div class="modal-content">
                <h2 class="modal-title">Spiel zurücksetzen</h2>
                <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Sollen die aktuellen Ergebnisse gespeichert werden?</p>
                <div class="confirm-btn-group">
                    <button id="btnResetSave" class="btn btn-primary">Speichern & Reset</button>
                    <button id="btnResetNoSave" class="btn btn-reset" style="border-color:var(--danger); color:var(--danger);">Nicht Speichern</button>
                    <button id="btnResetCancel" class="btn btn-secondary" style="margin-top: 10px;">Abbrechen</button>
                </div>
            </div>
        </div>

        <div id="editModal" class="modal-overlay">
            <div class="modal">
                <h3>Eintrag bearbeiten</h3>
                <div class="modal-content">
                    <input type="hidden" id="editId">
                    
                    <label>Team Name</label>
                    <input type="text" id="editName" class="robot-name-input" style="width:100%; margin-bottom:1rem; color:var(--text);">
                    
                    <label>Steine (Score)</label>
                    <div class="count-controls" style="margin-bottom:1rem;">
                        <button class="btn-minus" onclick="adjEditScore(-1)">-</button>
                        <span id="editScoreDisplay" style="font-size:1.5rem; font-weight:bold; width:50px; text-align:center;">0</span>
                        <button class="btn-plus" onclick="adjEditScore(1)">+</button>
                    </div>

                    <label>Gesamtzeit (Minuten)</label>
                    <input type="number" id="editTimeMin" class="robot-name-input" style="width:100%; color:var(--text);" placeholder="Minuten">
                </div>
                <div class="modal-actions">
                    <button id="btnEditCancel" class="btn btn-secondary">Abbrechen</button>
                    <button id="btnEditSave" class="btn btn-primary">Speichern</button>
                </div>
                <div style="margin-top:1rem; text-align:center;">
                    <button id="btnEditDelete" class="btn" style="color:var(--danger); background:none; border:none; text-decoration:underline;">Eintrag löschen</button>
                </div>
            </div>
        </div>

    </div>
    <script src="main.js"></script>
</body>
</html>
