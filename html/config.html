<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenga Setup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Placeholder for alignment (Back button position) -->
            <div style="width: 40px;"></div>

            <!-- Theme Toggle (Right) -->
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <svg class="icon" width="24" height="24" viewBox="-2 -2 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <g transform="translate(-3.54 -3.54)">
                        <path d="M9.173 14.83a4 4 0 1 1 5.657 -5.657"></path>
                        <path d="M3 12h1"></path>
                        <path d="M12 3v1"></path>
                        <path d="M5.6 5.6l.7 .7"></path>
                    </g>
                    <g transform="translate(3.54 3.54)">
                        <path d="M11.294 12.707l.174 .247a7.5 7.5 0 0 0 8.845 2.492a9 9 0 0 1 -14.671 2.914"></path>
                    </g>
                    <path d="M3 21L21 3"></path>
                </svg>
            </button>

            <div class="config-header-title">
                <h1 class="config-title">WLAN Setup</h1>
            </div>
        </div>
        
        <div class="config-content">
            <div class="wifi-section" style="margin-bottom: 1rem;">
                <div class="section-header" style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 0.75rem;">
                    <h2 class="section-title" style="margin: 0;">Geräte-ID</h2>
                    <button id="saveMdnsBtn" onclick="saveMdnsId()" class="btn btn-secondary btn-sm" title="Speichern">Speichern</button>
                </div>

                <div class="form-group" style="margin: 0;">
                    <div style="display:flex; align-items:center; gap: 0.5rem;">
                        <span style="color: var(--text-secondary);">jenga</span>
                        <input type="number" id="mdnsIdInput" class="form-input" style="max-width: 90px;" placeholder="" inputmode="numeric" min="1" max="99" autocomplete="off" spellcheck="false">
                        <span style="color: var(--text-secondary);">.local</span>
                    </div>
                    <div style="margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">
                        <span>Leer lassen = ID wird beim Boot automatisch gewählt (jenga1, jenga2, ...).</span>
                    </div>
                </div>
            </div>

            <div class="wifi-section">
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 class="section-title" style="margin: 0;">Verfügbare Netzwerke</h2>
                    <div class="action-buttons">
                        <button id="refreshBtn" onclick="fetchNetworks()" class="btn btn-secondary btn-sm" title="Aktualisieren">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 4v6h-6M1 20v-6h6"></path>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                        </button>
                        <button id="restartBtn" onclick="restartESP()" class="btn btn-secondary btn-sm" title="Neustarten" style="margin-left: 0.5rem;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                                <line x1="12" y1="2" x2="12" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div id="networkList" class="wifi-list">
                    <div class="loading">Suche Netzwerke...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="wifiModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">Verbinden</h3>
            <div class="form-group">
                <input type="text" id="ssidInput" class="form-input" placeholder="SSID" readonly>
            </div>
            <div class="form-group">
                <input type="password" id="passwordInput" class="form-input" placeholder="WLAN Passwort">
            </div>
            <div class="modal-actions">
                <button onclick="closeModal()" class="btn btn-secondary">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveWifi()">Verbinden</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title" id="confirmTitle">Bestätigung</h3>
            <p id="confirmMessage" style="margin-bottom: 1.5rem; color: var(--text-secondary);">Sind Sie sicher?</p>
            <div class="modal-actions">
                <button id="confirmCancelBtn" class="btn btn-secondary">Abbrechen</button>
                <button id="confirmOkBtn" class="btn btn-primary">Bestätigen</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
</body>
</html>
